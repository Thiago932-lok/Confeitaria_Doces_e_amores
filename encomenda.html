<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazer Encomenda — Marilene Bolos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="logo">🎂 Marilene Doces e Amores</div>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="encomenda.html">Fazer Encomenda</a></li>
    </ul>
    <a href="encomenda.html" class="nav-btn">Fazer Encomenda</a>
  </nav>

  <!-- FORMULÁRIO -->
  <section id="encomenda">
    <h2>Fazer Encomenda <span>🎂</span></h2>
    <p class="encomenda-subtitulo">Selecione o que desejar e será direcionado ao nosso WhatsApp!</p>

    <form id="form-encomenda">

      <!-- TIPO DE PEDIDO -->
      <div class="form-grupo">
        <label>O que você quer pedir?</label>
        <div class="opcoes-tipo">
          <button type="button" class="tipo-btn ativo" onclick="selecionarTipo('bolo', this)">🎂 Bolo</button>
          <button type="button" class="tipo-btn" onclick="selecionarTipo('kit', this)">🎁 Kit</button>
          <button type="button" class="tipo-btn" onclick="selecionarTipo('brigadeiro', this)">🍫 Brigadeiros</button>
        </div>
      </div>

      <!-- SEÇÃO BOLO -->
      <div id="secao-bolo" class="secao-pedido">

        <div class="form-grupo">
          <label>Tamanho do bolo</label>
          <select id="tamanho">
            <option value="">Selecione o tamanho...</option>
            <option value="15 fatias — R$ 115,00">15 fatias — R$ 115,00</option>
            <option value="20 fatias — R$ 130,00">20 fatias — R$ 130,00</option>
            <option value="30 fatias — R$ 140,00">30 fatias — R$ 140,00</option>
            <option value="40 fatias — R$ 190,00">40 fatias — R$ 190,00</option>
            <option value="50 fatias — R$ 225,00">50 fatias — R$ 225,00</option>
            <option value="70 fatias — R$ 350,00">70 fatias — R$ 350,00</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Massa</label>
          <select id="massa">
            <option value="">Selecione a massa...</option>
            <option value="Red Velvet">Red Velvet</option>
            <option value="Chocolate">Chocolate</option>
            <option value="Branca">Branca</option>
            <option value="Cacau Black (acréscimo no valor)">Cacau Black (acréscimo no valor)</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Recheio</label>
          <select id="recheio">
            <option value="">Selecione o recheio...</option>
            <option value="Coco">Coco</option>
            <option value="Prestígio">Prestígio</option>
            <option value="Brigadeiro/Chocolate">Brigadeiro/Chocolate</option>
            <option value="Sensação">Sensação</option>
            <option value="Quatro Leites">Quatro Leites</option>
            <option value="Limão">Limão</option>
            <option value="Doce de Leite">Doce de Leite</option>
            <option value="Maracujá">Maracujá</option>
            <option value="Ninho">Ninho</option>
            <option value="Café">Café</option>
            <option value="Sabor Especial (verificar disponibilidade)">Sabor Especial</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Opcionais (opcional)</label>
          <div class="opcionais-grid">
            <label class="opcional-item">
              <input type="checkbox" value="+ 6 Cupcakes"> 6 Cupcakes
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="+ 10 Docinhos"> 10 Docinhos
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="+ 20 Docinhos"> 20 Docinhos
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="+ 30 Docinhos"> 30 Docinhos
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="+ 50 Docinhos"> 50 Docinhos
            </label>
          </div>
        </div>

      </div>
      <!-- FIM SEÇÃO BOLO -->

      <!-- SEÇÃO KIT -->
      <div id="secao-kit" class="secao-pedido" style="display:none;">

        <div class="form-grupo">
          <label>Escolha o Kit</label>
          <select id="kit">
            <option value="">Selecione o kit...</option>
            <option value="Kit Mensário — R$ 110,00 (Bolo 8 fatias + 4 Cupcakes + 10 Docinhos)">Kit Mensário — R$ 110,00</option>
            <option value="Kit 01 — R$ 135,00 (Bolo 15 fatias + 6 Cupcakes)">Kit 01 — R$ 135,00</option>
            <option value="Kit 02 — R$ 170,00 (Bolo 20 fatias + 6 Cupcakes + 20 Docinhos)">Kit 02 — R$ 170,00</option>
            <option value="Kit 03 — R$ 190,00 (Bolo 30 fatias + 6 Cupcakes + 30 Docinhos)">Kit 03 — R$ 190,00</option>
            <option value="Kit 04 — R$ 300,00 (Bolo 40 fatias + 6 Cupcakes + 50 Docinhos)">Kit 04 — R$ 300,00</option>
            <option value="Kit 05 — R$ 350,00 (Bolo 50 fatias + 6 Cupcakes + 50 Docinhos)">Kit 05 — R$ 350,00</option>
            <option value="Kit 06 — R$ 500,00 (Bolo 70 fatias + 6 Cupcakes + 50 Docinhos)">Kit 06 — R$ 500,00</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Massa</label>
          <select id="massa-kit">
            <option value="">Selecione a massa...</option>
            <option value="Red Velvet">Red Velvet</option>
            <option value="Chocolate">Chocolate</option>
            <option value="Branca">Branca</option>
            <option value="Cacau Black (acréscimo no valor)">Cacau Black (acréscimo no valor)</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Recheio</label>
          <select id="recheio-kit">
            <option value="">Selecione o recheio...</option>
            <option value="Coco">Coco</option>
            <option value="Prestígio">Prestígio</option>
            <option value="Brigadeiro/Chocolate">Brigadeiro/Chocolate</option>
            <option value="Sensação">Sensação</option>
            <option value="Quatro Leites">Quatro Leites</option>
            <option value="Limão">Limão</option>
            <option value="Doce de Leite">Doce de Leite</option>
            <option value="Maracujá">Maracujá</option>
            <option value="Ninho">Ninho</option>
            <option value="Café">Café</option>
            <option value="Sabor Especial (verificar disponibilidade)">Sabor Especial</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Sabor dos Docinhos do Kit</label>
          <div class="opcionais-grid">
            <label class="opcional-item">
              <input type="checkbox" value="Tradicional"> Tradicional
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="Beijinho"> Beijinho
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="Ninho"> Ninho
            </label>
          </div>
          <small style="color: #7a4060; font-size: 0.8rem; margin-top: 0.4rem;">
            💡 Você pode escolher mais de um sabor!
          </small>
        </div>

      </div>
      <!-- FIM SEÇÃO KIT -->

      <!-- SEÇÃO BRIGADEIROS -->
      <div id="secao-brigadeiro" class="secao-pedido" style="display:none;">

        <div class="form-grupo">
          <label>Quantidade</label>
          <select id="brigadeiro">
            <option value="">Selecione a quantidade...</option>
            <option value="Cento de Brigadeiros — R$ 150,00">Cento (100 unidades) — R$ 150,00</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Sabores dos Brigadeiros</label>
          <div class="opcionais-grid">
            <label class="opcional-item">
              <input type="checkbox" value="Tradicional"> Tradicional
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="Beijinho"> Beijinho
            </label>
            <label class="opcional-item">
              <input type="checkbox" value="Ninho"> Ninho
            </label>
          </div>
          <small style="color: #7a4060; font-size: 0.8rem; margin-top: 0.4rem;">
            💡 Você pode escolher mais de um sabor!
          </small>
        </div>

      </div>
      <!-- FIM SEÇÃO BRIGADEIROS -->

      <!-- OBSERVAÇÕES -->
      <div class="form-grupo">
        <label>Alguma observação? (opcional)</label>
        <textarea id="obs" placeholder="Ex: tema da festa, cor, data do evento..." rows="3"></textarea>
      </div>

      <button type="submit" class="btn-whatsapp">
        📲 Enviar pelo WhatsApp
      </button>

    </form>
  </section>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2025 <strong>Marilene Doces e Amores</strong> — Teresina, PI</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
